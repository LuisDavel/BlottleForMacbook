name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  swift:
    name: Build & test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
      - name: Release build
        run: swift build -c release
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build steamwebhelper wrappers
        run: make wrapper
      - name: Bundle Blottle.app
        run: scripts/make-app.sh build
      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Blottle.app Blottle.app.zip
          cp ../.build/release/blottle blottle-cli
      - uses: actions/upload-artifact@v4
        with:
          name: Blottle-macOS
          path: |
            build/Blottle.app.zip
            build/blottle-cli
            build/tools/*.exe

  wrapper:
    name: steamwebhelper wrapper (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet & test
        working-directory: tools/steamwebhelper-wrapper
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Cross-compile
        run: make wrapper
